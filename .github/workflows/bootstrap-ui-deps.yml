name: Bootstrap UI dependencies

on:
  push:
    branches:
      - feat/mobile-first-production-ux
    paths:
      - .github/workflows/bootstrap-ui-deps.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-first-production-ux
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Add Tailwind CSS and daisyUI
        run: pnpm add -D tailwindcss @tailwindcss/vite daisyui
      - name: Commit regenerated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore(ui): add Tailwind and daisyUI dependencies [skip ci]"
          git push origin HEAD:feat/mobile-first-production-ux
